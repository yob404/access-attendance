{% extends "base.html" %}
{% block title %}员工管理{% endblock %}
{% block content %}
<h3>员工管理</h3>

<form class="inline" method="post" action="/employees/add">
  <input name="name" placeholder="姓名" required>
  <input name="dept" placeholder="部门（如 运维部）" required>
  <input name="card_no" placeholder="卡号（如 10001）" required>
  <button>新增员工</button>
</form>

<table>
  <thead><tr><th>ID</th><th>姓名</th><th>部门</th><th>卡号</th><th>状态</th><th>操作</th></tr></thead>
  <tbody>
    {% for e in employees %}
    <tr>
      <td>{{ e.id }}</td>
      <td>{{ e.name }}</td>
      <td>{{ e.dept }}</td>
      <td>{{ e.card_no }}</td>
      <td>{{ e.status }}</td>
      <td>
        <form method="post" action="/employees/{{ e.id }}/delete" style="display:inline">
          <button class="danger" onclick="return confirm('确定删除该员工？')">删除</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="6" class="muted">暂无员工，请在上方新增</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
